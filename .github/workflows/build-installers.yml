name: Build And Release Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: venta_tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: venta_tauri/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci

      - name: Build Windows installers
        run: npm run tauri:build

      - name: Prepare Windows release files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $releaseDir = "..\release-assets\windows"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null

          $msiFiles = @()
          $exeFiles = @()
          if (Test-Path "src-tauri\target\release\bundle\msi") {
            $msiFiles = Get-ChildItem -Path "src-tauri\target\release\bundle\msi" -Filter *.msi -File
          }
          if (Test-Path "src-tauri\target\release\bundle\nsis") {
            $exeFiles = Get-ChildItem -Path "src-tauri\target\release\bundle\nsis" -Filter *.exe -File
          }
          $allFiles = @($msiFiles + $exeFiles)
          if ($allFiles.Count -eq 0) {
            throw "No se encontraron instaladores Windows"
          }

          $msiFiles | ForEach-Object {
            Copy-Item $_.FullName -Destination $releaseDir -Force
          }

          $exeFiles | ForEach-Object {
            Copy-Item $_.FullName -Destination $releaseDir -Force
          }

          $hashLines = Get-ChildItem -Path $releaseDir -File | ForEach-Object {
            $h = Get-FileHash -Algorithm SHA256 $_.FullName
            "$($h.Hash)  $($_.Name)"
          }
          $hashLines | Set-Content -Path (Join-Path $releaseDir "SHA256SUMS.txt") -Encoding ascii

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ALTO-TRAGO-windows-installers
          path: release-assets/windows/*

  linux:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: venta_tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            rpm
          if apt-cache show libayatana-appindicator3-dev >/dev/null 2>&1; then
            sudo apt-get install -y libayatana-appindicator3-dev
          else
            sudo apt-get install -y libappindicator3-dev
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: venta_tauri/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci

      - name: Build Linux installers
        run: npm run tauri:build

      - name: Prepare Linux release files
        run: |
          set -euo pipefail
          release_dir="../release-assets/linux"
          mkdir -p "$release_dir"

          cp -f src-tauri/target/release/bundle/deb/*.deb "$release_dir"/ 2>/dev/null || true
          cp -f src-tauri/target/release/bundle/appimage/*.AppImage "$release_dir"/ 2>/dev/null || true
          cp -f src-tauri/target/release/bundle/rpm/*.rpm "$release_dir"/ 2>/dev/null || true

          if ! compgen -G "$release_dir/*" > /dev/null; then
            echo "No se encontraron instaladores Linux"
            exit 1
          fi

          (cd "$release_dir" && sha256sum * > SHA256SUMS.txt)

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ALTO-TRAGO-linux-installers
          path: release-assets/linux/*

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - windows
      - linux
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: ALTO-TRAGO-windows-installers
          path: release-assets/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: ALTO-TRAGO-linux-installers
          path: release-assets/linux

      - name: Build global checksum file
        run: |
          set -euo pipefail
          {
            echo "# Windows"
            cat release-assets/windows/SHA256SUMS.txt
            echo
            echo "# Linux"
            cat release-assets/linux/SHA256SUMS.txt
          } > release-assets/SHA256SUMS.txt

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/windows/*
            release-assets/linux/*
            release-assets/SHA256SUMS.txt
